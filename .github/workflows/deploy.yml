name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Content published from the back office goes live on the next run.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull published content and check for changes
        id: content
        run: |
          node scripts/pull-content.mjs
          NEW=$(node -p "require('./public/build-meta.json').contentHash")
          LIVE=$(curl -fsS "https://rtlawservice.web.app/build-meta.json?ts=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).contentHash)}catch{console.log('')}})" || true)
          echo "new=$NEW live=$LIVE"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NEW" = "$LIVE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.content.outputs.changed == 'true'
        run: npm run lint
      - if: steps.content.outputs.changed == 'true'
        run: npm run typecheck
      - if: steps.content.outputs.changed == 'true'
        run: npm run build

      - if: steps.content.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RTLAWSERVICE }}
          projectId: rtlawservice
          channelId: live
