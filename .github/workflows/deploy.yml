name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuilds the prerendered pages after back-office edits. Visitors see an
  # edit at once; this keeps the copies search engines read up to date.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The live site, read for published content. A repository variable can point
  # it elsewhere, for example the workers.dev address before the domain is attached.
  CONTENT_URL: ${{ vars.CONTENT_URL || 'https://rtlawservices.com' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull published content and check for changes
        id: content
        run: |
          node scripts/pull-content.mjs
          NEW=$(node -p "require('./public/build-meta.json').contentHash")
          LIVE=$(curl -fsS "$CONTENT_URL/build-meta.json?ts=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).contentHash)}catch{console.log('')}})" || true)
          echo "new=$NEW live=$LIVE"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NEW" = "$LIVE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.content.outputs.changed == 'true'
        run: npm run lint
      - if: steps.content.outputs.changed == 'true'
        run: npm run typecheck
      - if: steps.content.outputs.changed == 'true'
        run: npm run build
        env:
          # Address of the case status relay (workers/case-status), set as a repository variable.
          NEXT_PUBLIC_CASE_STATUS_RELAY: ${{ vars.NEXT_PUBLIC_CASE_STATUS_RELAY }}

      - if: steps.content.outputs.changed == 'true'
        name: Update the database structure
        run: npx wrangler d1 migrations apply rtlawservices --remote

      - if: steps.content.outputs.changed == 'true'
        name: Deploy to Cloudflare
        run: npx wrangler deploy
